# Secret scanning + push-protection exclusions.
#
# Exclude the committed qino-os MCP server bundle. It is a BUILD ARTIFACT,
# generated by `pnpm -F @qinolabs/qino-os build:plugin` (tsup inlines every
# dependency, `noExternal: [/.*/]`) and synced here by /release — real secrets
# are never authored in it. The inlined `@huggingface/transformers` model
# registry (mistral3, gemma*, qwen*, glm_ocr, …) carries ~32-char identifier
# strings that false-positive GitHub's provider-key detectors and block every
# bundle release at push time. `paths-ignore` scopes the exclusion to this one
# generated directory; push protection stays enabled everywhere else.
#
# Per GitHub docs, paths-ignore excludes a directory from BOTH alerts and push
# protection. Source of the bundle: qinolabs-repo/packages/qino-os (see
# CLAUDE.md "qino-os bundle" + .claude/commands/release.md).
paths-ignore:
  - "plugins/qino/servers/dist/**"
